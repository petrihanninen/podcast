<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#26106e">
  <title>Not Registered</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="centered">
    <div class="notice">
      <h1 class="page-title">No account</h1>
      <p>You're signed in but don't have an account yet. Ask the administrator for an invite link to get started.</p>
      <form action="/auth/logout" method="post">
        <button type="submit" class="btn">Sign out</button>
      </form>
    </div>
  </main>
</body>
</html>
