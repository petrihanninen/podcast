{% extends "base.html" %}
{% set active = 'new' %}
{% block title %}New Episode — Podcast{% endblock %}

{% block content %}
<div class="page-head">
  <h1 class="page-title">New episode</h1>
</div>

{% if error %}
<div class="form-error">{{ error }}</div>
{% endif %}

<form method="post" action="/" class="stack">
  <div class="field">
    <label for="topic" class="field-label">Topic</label>
    <textarea id="topic" name="topic" class="input" rows="6" placeholder="What do you want to learn about? Describe the topic, angle, or specific questions you want explored..." required></textarea>
  </div>

  <fieldset class="field">
    <legend class="field-label">Length</legend>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="target_length_minutes" value="15">
        <span>15 min</span>
      </label>
      <label class="choice">
        <input type="radio" name="target_length_minutes" value="30" checked>
        <span>30 min</span>
      </label>
      <label class="choice">
        <input type="radio" name="target_length_minutes" value="60">
        <span>60 min</span>
      </label>
      <label class="choice">
        <input type="radio" name="target_length_minutes" value="120">
        <span>2 hours</span>
      </label>
    </div>
  </fieldset>

  {% if password_required %}
  <div class="field">
    <label for="password" class="field-label">Password</label>
    <input type="password" id="password" name="password" class="input" placeholder="Required to create episodes" required>
  </div>
  {% endif %}

  <div class="actions">
    <button type="submit" class="btn btn-primary btn-big">Create episode</button>
  </div>
</form>

<script>
(function () {
  const STORAGE_KEY = 'episode_new_settings';
  const form = document.querySelector('form[action="/"]');
  if (!form) return;

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.target_length_minutes) {
      const radio = form.querySelector(
        `input[name="target_length_minutes"][value="${saved.target_length_minutes}"]`
      );
      if (radio) radio.checked = true;
    }
  } catch (_) {}

  form.addEventListener('submit', function () {
    try {
      const checkedRadio = form.querySelector('input[name="target_length_minutes"]:checked');
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        target_length_minutes: checkedRadio ? checkedRadio.value : null,
      }));
    } catch (_) {}
  });
})();
</script>
{% endblock %}
