<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#26106e">
  <title>{% block title %}Podcast{% endblock %}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="site">
    <header class="site-header">
      <p class="site-title"><a href="/episodes">Podcast</a></p>
      <nav class="site-nav" aria-label="Main">
        <a href="/" {% if active == 'new' %}aria-current="page"{% endif %}>New</a>
        <a href="/episodes" {% if active == 'episodes' %}aria-current="page"{% endif %}>Episodes</a>
        {% if user is defined and user %}
        <button type="button" id="copy-rss" data-feed-token="{{ user.feedToken }}">RSS</button>
        {% endif %}
        <a href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %}>Settings</a>
        {% if user is defined and user and user.isAdmin %}
        <a href="/metrics" {% if active == 'metrics' %}aria-current="page"{% endif %}>Metrics</a>
        {% endif %}
        <form action="/auth/logout" method="post">
          <button type="submit">Logout</button>
        </form>
      </nav>
    </header>

    <main class="page {% block page_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/static/js/toast.js"></script>
  <script src="/static/js/swipeable.js"></script>
  <script src="https://shoo.dev/shoo.js"></script>
  <script>
    (function() {
      var btn = document.getElementById('copy-rss');
      if (btn) {
        btn.addEventListener('click', function() {
          var token = this.getAttribute('data-feed-token');
          var url = location.origin + '/feed/' + token + '.xml';
          navigator.clipboard.writeText(url).then(function() {
            __toast('RSS feed URL copied');
          });
        });
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
